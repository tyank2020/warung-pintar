name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Tes juga dijalankan di zona waktu warung. Kalau ada hitungan hari yang
      # pakai jam perangkat, hasilnya beda di CI (UTC) dan di HP pemilik
      # warung (WIB) — dan bug-nya baru muncul di satu tempat.
      - name: Test (zona waktu warung)
        run: pnpm test
        env:
          TZ: Asia/Jakarta

      - name: Build
        run: pnpm build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check Edge Functions
        run: |
          deno fmt --check \
            supabase/functions/_shared \
            supabase/functions/parse-voice \
            supabase/functions/scan-receipt \
            supabase/functions/advisor \
            supabase/functions/seasonal-advisor \
            supabase/functions/_tests

      - name: Typecheck Edge Functions
        run: |
          deno check \
            supabase/functions/parse-voice/index.ts \
            supabase/functions/scan-receipt/index.ts \
            supabase/functions/advisor/index.ts \
            supabase/functions/seasonal-advisor/index.ts

      - name: Test Edge Functions
        run: deno test --allow-env supabase/functions/_tests/functions_test.ts
